<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>따릉이 재배치 | 차량별 최적 경로</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,'Malgun Gothic',sans-serif}
header{background:#fff;padding:17px 22px;border-bottom:1px solid #ddd}
h1{font-size:21px;margin:0 0 7px}header p{margin:0;color:#64748b;font-size:14px}
#status{background:#fff;color:#b91c1c;font-size:13px;padding:8px 22px;min-height:31px;white-space:pre-wrap}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:75vh}
aside{background:#fff;padding:20px;border-right:1px solid #ddd;max-height:80vh;overflow:auto}
label{font-weight:bold;display:block;margin-bottom:8px}
select{width:100%;background:#fff;color:#172033;border:1px solid #cbd5e1;border-radius:8px;padding:12px;font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.stat{background:#f1f5f9;border-radius:8px;padding:12px;font-size:12px;color:#475569}
.stat strong{display:block;color:#172033;font-size:18px;margin-top:5px}
.action{font-size:13px;color:#0f172a;background:#f1f5f9;border-radius:6px;margin-top:7px;padding:7px 9px;line-height:1.7}.action b{font-weight:750}.load{color:#0f766e;font-weight:700} h2{font-size:17px;margin:18px 0 8px}.visit{border-bottom:1px solid #e5e7eb;padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.num{display:inline-flex;background:#334155;color:#fff;border-radius:20px;min-width:27px;height:27px;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
.name{font-size:14px;font-weight:700}.desc{font-size:12px;color:#64748b;margin-top:3px}
.note{color:#64748b;font-size:12px;line-height:1.7;margin-top:15px}
#map{height:80vh;min-height:560px;width:100%;background:#eef2f7}
.stop-badge{background:#fff;border:2px solid #111827;border-radius:50%;min-width:27px;height:27px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;box-shadow:0 1px 5px #0004}
.direction{font-size:23px;font-weight:bold;line-height:23px;text-shadow:0 0 2px #fff,0 0 3px #fff;pointer-events:none}
footer{padding:10px 20px;background:#fff;color:#64748b;font-size:12px}
@media(max-width:750px){.layout{display:block}aside{max-height:none}#map{height:65vh;min-height:430px}}
</style>
</head>

<script>
(function(){
'use strict';
const el=id=>document.getElementById(id);
const status=msg=>{el('status').textContent=msg;};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,n=1)=>x==null||!Number.isFinite(Number(x))?'—':Number(x).toFixed(n);
let data, map=null, current=[], info=null;
function clearCurrent(){for(const x of current){try{x.setMap(null);}catch(e){console.warn(e);}}current=[];if(info)info.close();}
function track(x){current.push(x);return x;}
try{data=JSON.parse(el('route-data').textContent);}catch(e){status('경로 데이터 JSON 오류: '+e.message);console.error(e);return;}
if(!Array.isArray(data.routes)||data.routes.length===0){status('차량 경로 데이터가 없습니다. 8번 셀의 routes 결과를 확인하세요.');return;}
const select=el('vehicleSelect');select.innerHTML='';
for(const r of data.routes){const opt=document.createElement('option');opt.value=String(r.vehicle);opt.textContent='차량 '+r.vehicle;select.appendChild(opt);}
function renderInfo(r){
  el('stats').innerHTML=
    '<div class="stat">방문 횟수<strong>'+Math.max(0,(r.visits||[]).length-2)+'</strong></div>'+
    '<div class="stat">주행거리<strong>'+fmt(r.drive_km,2)+' km</strong></div>'+
    '<div class="stat">도로 주행시간<strong>'+fmt(r.drive_min)+' 분</strong></div>'+
    '<div class="stat">Gurobi 완료시간<strong>'+fmt(r.completion_min)+' 분</strong></div>';
  el('visits').innerHTML=(r.visits||[]).map((v,i)=>{
    let kind=v.type==='pickup'?'수거':v.type==='delivery'?'배송':v.type==='balanced'?'균형':'Depot';
    let note=i===0?'출발':i===r.visits.length-1?'복귀':`방문 ${i} · ${kind}`;
    if(v.current!=null)note+=' · 현재 '+v.current+'대 / 목표 '+v.target+'대';
    let action='';
    if(i===0){
      action='<div class="action">출발 적재량: <span class="load">0대</span></div>';
    } else if(i===r.visits.length-1){
      action='<div class="action">복귀 적재량: <span class="load">'+esc(v.load_after)+'대</span></div>';
    } else {
      const pickups=Number(v.pickup_qty||0), deliveries=Number(v.delivery_qty||0);
      const parts=[];
      if(pickups)parts.push('<b>수거 +'+pickups+'대</b>');
      if(deliveries)parts.push('<b>배송 −'+deliveries+'대</b>');
      if(!parts.length)parts.push('수거·배송 없음');
      action='<div class="action">이번 방문: '+parts.join(' / ')+'<br>다음 이동 전 차량 적재량: <span class="load">'+esc(v.load_after)+'대 / '+esc(v.capacity)+'대</span></div>';
    }
    return '<div class="visit"><span class="num" style="background:'+esc(r.color)+'">'+i+'</span><div><div class="name">'+esc(v.name)+'</div><div class="desc">'+esc(note)+'</div>'+action+'</div></div>';
  }).join('');
}
function addDirections(coords,color){
  if(!Array.isArray(coords)||coords.length<2)return;
  let d=[0], total=0;
  for(let i=1;i<coords.length;i++){
    let a=coords[i-1],b=coords[i],rad=(a[0]+b[0])*Math.PI/360;
    total+=Math.hypot((b[1]-a[1])*Math.cos(rad),b[0]-a[0]);d.push(total);
  }
  if(total===0)return;
  let count=Math.min(12,Math.max(2,Math.ceil(total*111000/800)));
  for(let j=1;j<=count;j++){
    let target=total*j/(count+1),i=1;
    while(i<d.length-1&&d[i]<target)i++;
    let a=coords[i-1],b=coords[i],span=d[i]-d[i-1];if(span<=0)continue;
    let t=(target-d[i-1])/span,lat=a[0]+(b[0]-a[0])*t,lon=a[1]+(b[1]-a[1])*t;
    let dx=(b[1]-a[1])*Math.cos(lat*Math.PI/180),dy=-(b[0]-a[0]);
    let marker=document.createElement('span');marker.className='direction';marker.textContent='➤';marker.style.color=color;
    marker.style.transform='rotate('+Math.atan2(dy,dx)*180/Math.PI+'deg)';
    track(new kakao.maps.CustomOverlay({map,position:new kakao.maps.LatLng(lat,lon),content:marker,xAnchor:.5,yAnchor:.5,zIndex:5}));
  }
}
function renderVehicle(){
  const r=data.routes.find(x=>String(x.vehicle)===select.value);if(!r)return;
  renderInfo(r); // 카카오 SDK와 무관하게 목록은 먼저 보여준다.
  if(!map)return;
  try{
    clearCurrent();
    let bounds=new kakao.maps.LatLngBounds();
    const pts=r.coords.map(p=>new kakao.maps.LatLng(p[0],p[1]));
    if(pts.length>=2){track(new kakao.maps.Polyline({map,path:pts,strokeWeight:6,strokeColor:r.color,strokeOpacity:.85}));pts.forEach(p=>bounds.extend(p));}
    addDirections(r.coords,r.color);
    let repetitions={};
    (r.visits||[]).forEach((v,i)=>{
      const pos=new kakao.maps.LatLng(v.lat,v.lon);bounds.extend(pos);
      if(i===0||i===r.visits.length-1)return;
      const n=repetitions[v.label]||0;repetitions[v.label]=n+1;
      let badge=document.createElement('div');badge.className='stop-badge';badge.style.borderColor=r.color;badge.textContent=String(i);
      badge.title=i+'번째 방문: '+v.name;badge.style.transform='translateX('+(n*19)+'px)';
      track(new kakao.maps.CustomOverlay({map,position:pos,content:badge,xAnchor:.5,yAnchor:1.2,zIndex:8}));
    });
    map.setBounds(bounds);map.relayout();
  }catch(e){console.error(e);status('경로 렌더링 오류: '+e.message);}
}
select.addEventListener('change',renderVehicle);select.value=String(data.routes[0].vehicle);renderVehicle();
status('차량 데이터 로딩 완료. 카카오 지도 연결 중...');
// 데이터와 차량 메뉴를 렌더링한 다음 SDK 로딩을 시작한다.
const sdk=document.createElement('script');
sdk.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey=f9ca362d1eb07a0c7a0f9454949f4e0a&autoload=false';
sdk.onerror=()=>status('카카오 지도 SDK 다운로드 실패: JavaScript 키, 앱의 카카오맵 사용 설정, GitHub Pages 도메인을 확인하세요.');
sdk.onload=()=>{
  if(!window.kakao||!kakao.maps){status('카카오 SDK 응답은 왔지만 maps 객체가 없습니다. 앱 설정·키·브라우저 콘솔을 확인하세요.');return;}
  kakao.maps.load(()=>{
    try{
      const center=new kakao.maps.LatLng(data.depot.lat,data.depot.lon);
      map=new kakao.maps.Map(el('map'),{center,level:5});
      info=new kakao.maps.InfoWindow({removable:true});
      let depot=new kakao.maps.Marker({map,position:center,title:'Depot'});
      kakao.maps.event.addListener(depot,'click',()=>{info.setContent('<div style="padding:8px">Depot (출발·복귀)</div>');info.open(map,depot);});
      for(const s of data.stations||[]){
        const pos=new kakao.maps.LatLng(s.lat,s.lon);
        const color=s.type==='pickup'?'#d32f2f':s.type==='delivery'?'#1976d2':'#757575';
        let circle=new kakao.maps.Circle({map,center:pos,radius:12,strokeWeight:2,strokeColor:color,fillColor:color,fillOpacity:.75});
        kakao.maps.event.addListener(circle,'click',()=>{
          info.setContent('<div style="padding:8px;white-space:nowrap">'+esc(s.name)+'<br>현재 '+s.current+'대 / 목표 '+s.target+'대</div>');
          info.setPosition(pos);info.open(map);
        });
      }
      renderVehicle();status(data.actualRoad?'':'주의: estimate 모드라 직선 경로는 실제 도로 경로가 아닙니다.');
    }catch(e){console.error(e);status('카카오 지도 초기화 오류: '+e.message);}
  });
};
document.head.appendChild(sdk);
})();
</script>
</body></html>
